# One-shot workflow: removed automatically after the verified patch is committed.
name: repair-issue-2

on:
  push:
    branches:
      - fix/issue-2-safe-asset-field-decode
    paths:
      - .github/workflows/repair-issue-2.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/issue-2-safe-asset-field-decode
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install pnpm and dependencies
        run: |
          npm install --global pnpm@10.34.1
          pnpm install --frozen-lockfile
      - name: Apply narrow decode fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('server/node/azureStorage.cjs')
          text = path.read_text()
          old = '''      const raw = row.value;
                const parsed = typeof raw === "string" ? JSON.parse(raw) : raw;
                fields[row.key] = decodePostgresJsonValue(parsed);'''
          new = '''      const raw = row.value;
                let parsed = raw;
                if (typeof raw === "string") {
                  try {
                    parsed = JSON.parse(raw);
                  } catch {
                    parsed = raw;
                  }
                }
                fields[row.key] = decodePostgresJsonValue(parsed);'''
          if text.count(old) != 1:
              raise SystemExit('expected exactly one asset-field decode block')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check -- server/node/azureStorage.cjs
          git diff -- server/node/azureStorage.cjs
      - name: Verify targeted Azure storage tests
        run: pnpm exec vitest run server/node/azureStorageAssetFields.test.ts server/node/azureStorage.test.ts
      - name: Commit verified fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/repair-issue-2.yml
          git add server/node/azureStorage.cjs server/node/azureStorageAssetFields.test.ts
          git commit -m 'fix: preserve plain Azure character attributes'
          git push origin HEAD:fix/issue-2-safe-asset-field-decode
